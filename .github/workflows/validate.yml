name: Validate template
on:
  push:
  pull_request:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  platform-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install published Grumo and template
        run: |
          python -m pip install "grumo==2.0.1" "grumo-store>=2.0.0,<3.0.0"
          python -m pip install -e "default[dev,browser]"
          python -m pip install "pip-audit==2.10.1"
          python scripts/audit_environment.py
      - run: python scripts/validate.py
      - run: python scripts/platform_contract.py
      - run: python -m pytest -q default/tests/test_app.py default/tests/test_compatibility.py
      - run: python -m playwright install chromium
      - run: python scripts/generated_app_contract.py --project default --browser
  scaffold-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: helderperez-dev/grumo
          path: framework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_parity.py --framework-root framework/src/grumo/scaffold/default
      - run: python scripts/check_source_sync.py --framework-root framework/src/grumo/scaffold/default
  release-evidence:
    runs-on: ubuntu-latest
    needs: [platform-contract, scaffold-parity]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv lock --project default --python 3.12
      - run: python scripts/release_manifest.py --output /tmp/grumo-templates-manifest.json
      - run: python scripts/bundle_sbom.py --output /tmp/grumo-templates-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: grumo-template-release-evidence
          path: |
            default/uv.lock
            /tmp/grumo-templates-manifest.json
            /tmp/grumo-templates-sbom.json
      - uses: actions/attest-build-provenance@v2
        if: github.event_name == 'push'
        with:
          subject-path: |
            /tmp/grumo-templates-manifest.json
            /tmp/grumo-templates-sbom.json
